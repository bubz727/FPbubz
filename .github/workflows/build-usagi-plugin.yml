name: Build Usagi Plugin

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Memungkinkan kamu menjalankan build secara manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JAR with Gradle
        run: ./gradlew jar

      - name: Convert to DEX (Dalvik Executable)
        run: |
          # Mencari tool D8 dari Android SDK bawaan GitHub Actions
          D8_PATH=$(find $ANDROID_SDK_ROOT/build-tools -name d8 | sort -r | head -n 1)
          
          # Membuat folder output
          mkdir dex_out
          
          # Mengonversi JAR menjadi DEX
          $D8_PATH --output dex_out build/libs/kotatsu-parsers.jar

      - name: Package Plugin (Dexed JAR)
        run: |
          cd dex_out
          zip -r ../plugin.jar classes.dex
          cd ..
          echo "Build selesai! Ukuran plugin:"
          ls -lh plugin.jar

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Usagi-Plugin
          path: plugin.jar

      - name: Create Continuous Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Usagi Plugin (Latest Auto-Build)"
          body: "Plugin ini di-build secara otomatis dari kode terbaru (master)."
          files: plugin.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
